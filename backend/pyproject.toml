[project]
name = "veloce-backend"
version = "0.1.0"
description = "Veloce Car Marketplace - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "authlib>=1.3.0",
    "pyjwt[crypto]>=2.10.0",
    "python-socketio>=5.11.0",
    "pillow>=11.0.0",
    "aiofiles>=24.1.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "faker>=30.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]